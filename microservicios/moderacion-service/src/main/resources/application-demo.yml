# Solo laboratorio: datos en memoria, se pierden al detener el proceso.
spring:
  datasource:
    url: jdbc:h2:mem:moderacion;MODE=Oracle;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
app:
  jwt-secret: solo-demostracion-cambiar-esta-clave-de-32-bytes
